services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - 80
    environment:
      - WEB_DOCUMENT_ROOT=/app/public
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
    volumes:
      - nodus-storage:/app/storage/app/public
    env_file:
      - path: .env
        required: false
    networks:
      - coolify # TAMBAHKAN INI

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3
    depends_on:
      - web
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
    volumes:
      - nodus-storage:/app/storage/app/public
    env_file:
      - path: .env
        required: false
    networks:
      - coolify # TAMBAHKAN INI

volumes:
  nodus-storage:
    driver: local

# TAMBAHKAN BLOK INI DI PALING BAWAH
networks:
  coolify:
    external: true